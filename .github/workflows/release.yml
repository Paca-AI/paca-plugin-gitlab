name: Build and Release Plugin Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup TinyGo
        run: |
          set -euo pipefail
          curl -sL -o /tmp/tinygo.deb https://github.com/tinygo-org/tinygo/releases/download/v0.41.1/tinygo_0.41.1_amd64.deb
          sudo dpkg -i /tmp/tinygo.deb

      - name: Build backend WASM
        working-directory: backend
        run: |
          set -euo pipefail
          mkdir -p ../release/backend
          tinygo build -target=wasip1 -buildmode=c-shared -o ../release/backend/gitlab.wasm .

      # The plugin is provider-only: a backend, its migrations and the manifest.
      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p release/migrations
          cp -R backend/migrations/. release/migrations/

          cp plugin.json release/plugin.json

      - name: Create archives
        run: |
          set -euo pipefail
          tar -czf gitlab-backend-wasm.tar.gz -C release/backend gitlab.wasm
          tar -czf gitlab-migrations.tar.gz -C release migrations
          tar -czf gitlab-plugin-manifest.tar.gz -C release plugin.json

      - name: Generate checksums
        run: |
          set -euo pipefail
          sha256sum gitlab-backend-wasm.tar.gz \
            gitlab-migrations.tar.gz \
            gitlab-plugin-manifest.tar.gz > checksums.txt

      - name: Publish GitLab Release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            gitlab-backend-wasm.tar.gz
            gitlab-migrations.tar.gz
            gitlab-plugin-manifest.tar.gz
            checksums.txt
